<title>Çiftlik İmparatorluğu</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Düzen: tam ekran 3D harita. Bölümler yerdeki küçük isim etiketleriyle işaretli; üstte kaynak hapları, altta ikon dok, seçilen bölümde sağda (telefonda altta) kâğıt kart. Tek görünüm: 50'ler çizgi film, kâğıt ve mürekkep. */
:root{
  --sky-top:#a3c4c0; --sky-low:#efe0b6;
  --paper:#f3e6c4; --paper-2:#ead9b2; --card:#fbf3df; --line:#d9c497;
  --ink:#2a1a10; --text:#2c2418; --muted:#7d6c52;
  --forest:#2f6b3a; --forest-dk:#1f4d28; --leaf:#5aa047;
  --honey:#f2b330; --honey-dk:#c98a12; --brick:#c4492e; --brick-dk:#8f2f1c; --sky:#3f6fa0;
  --wood:#7a4e2d; --wood-dk:#4f3119;
  --f-display:"Alfa Slab One","Rockwell","Georgia",serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:linear-gradient(180deg,var(--sky-top) 0%,#d3d7bd 45%,var(--sky-low) 100%);color:var(--text);font-family:var(--f-body);font-size:14px;overflow:hidden;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--honey);outline-offset:2px}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
#marks{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:2}
@keyframes boing{0%{transform:scale(1)}30%{transform:scale(1.12,.9)}60%{transform:scale(.95,1.06)}100%{transform:scale(1)}}
@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -4px}}

.hud{position:fixed;z-index:5;top:calc(10px + env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;gap:8px;align-items:flex-start;pointer-events:none}
.hud>*{pointer-events:auto}
.plate{margin-right:auto;background:linear-gradient(180deg,#9a5a32,#7a3f22);color:var(--paper);border-radius:14px;padding:5px 14px 7px;border:2.5px solid var(--ink);box-shadow:3px 4px 0 var(--ink);transform:rotate(-1.2deg)}
.plate h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:19px;line-height:1.05;letter-spacing:.3px;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.plate small{display:block;font-size:10px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:#f3d28a}
.pills{display:flex;flex-wrap:wrap;gap:7px;justify-content:flex-end}
.pill{display:flex;align-items:center;gap:7px;height:36px;padding:0 13px 0 4px;border-radius:999px;background:var(--paper);border:2.5px solid var(--ink);box-shadow:2px 3px 0 var(--ink);font-weight:900;font-size:14.5px;font-variant-numeric:tabular-nums}
.pill.bump{animation:boing .45s}
.coin{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9a3,var(--honey) 55%,var(--honey-dk));box-shadow:inset 0 -2px 0 rgba(0,0,0,.18);display:grid;place-items:center;font-size:12px;color:#7a4a00;font-weight:900}
.ring{--p:0%;width:28px;height:28px;border-radius:50%;background:conic-gradient(var(--leaf) var(--p),#e4dccb 0);display:grid;place-items:center}
.ring b{width:21px;height:21px;border-radius:50%;background:var(--forest);color:#fff;display:grid;place-items:center;font-size:11px}
.pill.lvl{padding-right:4px}
.star{width:26px;height:26px;border-radius:50%;background:#fde7d9;color:var(--brick);display:grid;place-items:center;font-size:13px}
.barnic{width:26px;height:26px;border-radius:50%;background:#e6f0dd;display:grid;place-items:center;font-size:13px}
.pill.full{background:#fbe0d6}

.dock{position:fixed;z-index:5;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:5px;padding:6px;border-radius:22px;background:var(--paper);border:2.5px solid var(--ink);box-shadow:3px 4px 0 var(--ink)}
.dock button{position:relative;width:44px;height:44px;border-radius:14px;border:2px solid var(--ink);background:var(--card);font-size:21px;display:grid;place-items:center;transition:transform .15s}
.dock button:hover{transform:translateY(-3px)}
.dock button[aria-current="true"]{background:var(--honey)}
.dot{position:absolute;top:-7px;right:-7px;min-width:18px;height:18px;border-radius:9px;background:var(--brick);color:#fff;font-size:10px;font-style:normal;font-weight:900;display:grid;place-items:center;border:2px solid var(--ink);padding:0 4px}
.cam{position:fixed;z-index:4;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(2,34px);gap:6px}
.cam button{width:34px;height:34px;border:2.5px solid var(--ink);border-radius:11px;background:var(--paper);box-shadow:2px 3px 0 var(--ink);font-weight:900;font-size:15px;color:var(--wood)}
.back{position:fixed;z-index:6;left:max(12px,env(safe-area-inset-left,0px));top:calc(62px + env(safe-area-inset-top,0px));border:2.5px solid var(--ink);border-radius:999px;padding:7px 16px 7px 12px;background:var(--forest);color:#fff;font-weight:900;box-shadow:2px 3px 0 var(--ink)}

/* Haritadaki isim etiketleri */
.mk{position:absolute;left:0;top:0}
.tag.below{transform:translate(-50%,7px);margin-top:0}.tag.below:hover,.tag.below.hot{transform:translate(-50%,7px)}
.tag.dk{transition:background .15s}.tag.dk:hover,.tag.dk.hot{background:#ffe7a8}
.tag.below::after{bottom:auto;top:-7px;border-top:0;border-bottom:6px solid var(--ink);border-top-color:transparent}
.tag.dk{height:24px;padding:0 9px 0 3px;gap:5px;background:#fffaf0;box-shadow:2px 2px 0 var(--ink);-webkit-font-smoothing:antialiased}
.tag.dk b{font-family:var(--f-body);font-weight:900;font-size:12px;letter-spacing:.1px;color:#2a1a10}
.tag.dk .ti{width:19px;height:19px;font-size:11px}
.tag.dk .s{top:-9px;left:-9px;right:auto;min-width:18px;height:18px;font-size:9.5px}
.tag.side{transform:translate(8px,-50%);margin-top:0}.tag.side:hover,.tag.side.hot{transform:translate(8px,-50%)}
.tag.side::after{left:-7px;bottom:auto;top:50%;margin:-6px 0 0;border:6px solid transparent;border-right-color:var(--ink);border-left:0}
.tag{pointer-events:auto;position:relative;transform:translate(-50%,-100%);display:flex;align-items:center;gap:6px;height:28px;padding:0 11px 0 3px;border-radius:999px;background:var(--paper);border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink);white-space:nowrap;transition:transform .15s,background .15s;margin-top:-8px}
.tag::after{content:"";position:absolute;left:50%;bottom:-8px;margin-left:-6px;border:6px solid transparent;border-top-color:var(--ink);border-bottom:0}
.tag:hover,.tag.hot{transform:translate(-50%,-100%) scale(1.1);background:#fff8e3}
.tag .ti{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12.5px;background:#fff;border:1.5px solid var(--ink)}
.tag b{font-family:var(--f-display);font-weight:400;font-size:12.5px;color:#3a2414;letter-spacing:.2px}
.tag .s{position:absolute;top:-11px;left:-9px;min-width:20px;height:20px;border-radius:10px;border:2px solid var(--ink);font-style:normal;font-weight:900;font-size:10.5px;display:grid;place-items:center;padding:0 3px}
.tag .s.ok{background:var(--leaf);color:#fff;animation:bob 1.1s ease-in-out infinite}
.tag .s.new{background:var(--honey)}
.tag .s.idle{background:var(--card);font-size:9.5px}
.tag.lock{background:#4a3a2a;height:auto;padding:3px 11px 4px 3px}
.tag.lock b{color:#f3e6c4}
.tag.lock .ti{background:#6a5440;color:#fff}
.tag.lock small{display:block;font-size:10.5px;font-weight:900;color:#f2c96a;line-height:1.1}
.bub{pointer-events:auto;border:2.5px solid var(--ink);padding:0;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:20px;transform:translate(-50%,-100%);background:#fffaf0;box-shadow:2px 3px 0 var(--ink);position:relative;animation:bob 1.1s ease-in-out infinite}
.bub::after{content:"✓";position:absolute;right:-6px;top:-6px;width:17px;height:17px;border-radius:50%;background:var(--leaf);color:#fff;font-size:10px;font-weight:900;display:grid;place-items:center;border:2px solid var(--ink)}
.prog{--p:0%;width:30px;height:30px;border-radius:50%;transform:translate(-50%,-100%);border:2.5px solid var(--ink);background:conic-gradient(var(--honey) var(--p),rgba(255,250,240,.8) 0);display:grid;place-items:center}
.prog span{width:20px;height:20px;border-radius:50%;background:#fffaf0;display:grid;place-items:center;font-size:11px}

/* Bölüm kartı */
.sheet{position:fixed;z-index:8;top:calc(60px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));width:340px;max-height:calc(100% - 140px);display:flex;flex-direction:column;
  background:var(--paper);border-radius:22px;border:2.5px solid var(--ink);box-shadow:5px 6px 0 var(--ink);overflow:hidden;animation:slide .25s ease-out}
.sheet::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 30% 15%,rgba(255,255,255,.4),transparent 60%),radial-gradient(ellipse at 80% 100%,rgba(140,90,40,.12),transparent 60%);border-radius:inherit}
body.focus .sheet,body.inside .sheet{max-height:calc(100% - 80px)}
@keyframes slide{from{opacity:0;transform:translateX(16px)}}
.sh-head{display:flex;gap:11px;align-items:center;padding:12px 48px 10px 12px;position:relative;flex:none;border-bottom:2px dashed rgba(42,26,16,.25)}
.thumb{width:56px;height:56px;flex:none;border-radius:16px;border:2px solid var(--ink);box-shadow:2px 3px 0 var(--ink);background:radial-gradient(circle at 50% 35%,#e9e3b8,#b9c27e);display:grid;place-items:center;font-size:26px;overflow:hidden}
.thumb img{width:115%;height:115%;object-fit:cover}
.thumb.sm{width:42px;height:42px;border-radius:12px;font-size:20px;box-shadow:none}
.ttl{min-width:0}
.sh-head h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:21px;line-height:1.08;color:#3a2414;text-wrap:balance}
.sub{margin-top:3px;font-size:12px;font-weight:800;color:var(--muted)}
.stars{display:flex;gap:2px}
.stars i{width:13px;height:13px;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);background:#d8c9a6}
.stars i.on{background:var(--honey)}
.x{position:absolute;top:50%;right:12px;margin-top:-15px;width:30px;height:30px;border:2px solid var(--ink);border-radius:50%;background:var(--paper-2);font-weight:900;color:var(--wood)}
.sh-body{overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px;position:relative}
.sheet.mini .sh-body{display:none}
.sheet.mini .sh-head{border-bottom:0}

.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.tile{border:2px solid var(--ink);border-radius:14px;background:var(--card);box-shadow:2px 3px 0 rgba(42,26,16,.9);padding:6px 3px 5px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0;transition:transform .1s}
button.tile:hover:not(:disabled){transform:translateY(-2px)}
button.tile:active:not(:disabled){animation:boing .3s}
.tile:disabled{opacity:.55;cursor:not-allowed}
.big{position:relative;font-size:26px;line-height:1.12}
.big i{position:absolute;right:-13px;bottom:-1px;font-style:normal;font-weight:900;font-size:10.5px;background:var(--ink);color:#fff;border-radius:7px;padding:0 4px;line-height:1.45}
.ins{display:flex;flex-wrap:wrap;justify-content:center;gap:1px 5px;font-size:11.5px;font-weight:900}
.ins b{white-space:nowrap}
.miss{color:var(--brick)}
.tm{font-size:10.5px;font-weight:800;color:var(--muted);white-space:nowrap}
.tile.sell .two{display:flex;gap:4px;margin-top:3px}
.tile.sell .two button{border:1.5px solid var(--ink);border-radius:8px;background:var(--paper-2);font-weight:900;font-size:11px;padding:1px 7px}
.tile.sell .two button:last-child{background:var(--forest);color:#fff}
.up,.pill-btn{border:2px solid var(--ink);border-radius:999px;padding:6px 12px;font-weight:900;font-size:12.5px;background:var(--paper-2);box-shadow:2px 2px 0 var(--ink);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.up{background:var(--honey);color:#4a2f00}
.up span{opacity:.85}
.pill-btn.gold{background:var(--honey);color:#4a2f00}
.pill-btn.go{background:var(--forest);color:#fff}
.up:disabled,.pill-btn:disabled{background:#ddd1b6;color:#8b7d62;border-color:#8b7d62;box-shadow:2px 2px 0 #8b7d62;cursor:not-allowed}
.up:active:not(:disabled),.pill-btn:active:not(:disabled){animation:boing .3s}
.urow{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.unit{display:flex;flex-direction:column;gap:8px}
.unit+.unit{border-top:2px dashed rgba(42,26,16,.2);padding-top:10px}
.uhead{display:flex;justify-content:space-between;align-items:center;font-family:var(--f-display);font-size:14px;color:#3a2414}
.job{display:flex;align-items:center;gap:12px;border:2px solid var(--ink);border-radius:14px;background:var(--card);box-shadow:2px 3px 0 rgba(42,26,16,.9);padding:8px 12px}
.job .big{flex:none}
.pw{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.pw b{font-weight:900;font-size:13.5px}
.pw small{font-size:11.5px;font-weight:800;color:var(--muted)}
button.job.ready{background:var(--honey);width:100%;justify-content:center;animation:bob 1.1s ease-in-out infinite}
button.job.ready b{font-family:var(--f-display);font-weight:400;font-size:17px;color:#4a2f00}
.pbar{height:10px;border-radius:9px;background:#e8dcbf;overflow:hidden;border:1.5px solid rgba(42,26,16,.45)}
.pbar i{display:block;height:100%;background:repeating-linear-gradient(-45deg,rgba(255,255,255,.28) 0 6px,transparent 6px 12px),linear-gradient(90deg,var(--honey),#f6cf6b);animation:stripes 1s linear infinite;background-size:17px 17px,100% 100%}
@keyframes stripes{to{background-position:17px 0,0 0}}
.build{display:flex;align-items:center;gap:10px;border:2px dashed rgba(42,26,16,.7);border-radius:14px;padding:8px 10px}
.build.off{opacity:.6}
.build .t{flex:1;min-width:0}
.build b{display:block;font-family:var(--f-display);font-weight:400;font-size:14px;color:#3a2414}
.build small{display:block;font-size:11.5px;font-weight:800;color:var(--muted);line-height:1.3}
.btn{border:2px solid var(--ink);border-radius:12px;padding:7px 13px;font-weight:900;background:var(--forest);color:#fff;box-shadow:2px 3px 0 var(--ink);white-space:nowrap}
.btn.gold{background:var(--honey);color:#4a2f00}
.btn.soft{background:var(--paper-2);color:var(--wood)}
.btn.red{background:var(--brick)}
.btn.big{width:100%;padding:11px;font-size:15px;border-radius:14px}
.btn.ghost{background:transparent;box-shadow:none;border:0;color:var(--brick);padding:4px 0;font-size:12.5px;align-self:flex-start}
.btn:disabled{background:#ddd1b6;color:#8b7d62;border-color:#8b7d62;box-shadow:2px 3px 0 #8b7d62;cursor:not-allowed}
.btn:active:not(:disabled){animation:boing .3s}
.seeds{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.seed{border:2px solid var(--ink);border-radius:12px;background:var(--card);padding:4px 0 3px;display:flex;flex-direction:column;align-items:center;box-shadow:2px 2px 0 rgba(42,26,16,.9)}
.seed em{font-style:normal;font-size:21px;line-height:1.15}
.seed small{font-weight:900;font-size:10.5px}
.seed.on{background:var(--honey)}
.seed:disabled{opacity:.45;cursor:not-allowed}
.plots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.plot{border:2px solid var(--ink);border-radius:12px;aspect-ratio:1.3;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:repeating-linear-gradient(0deg,#8a5a33 0 7px,#7a4c2a 7px 10px);color:#fff6e0;box-shadow:2px 2px 0 rgba(42,26,16,.9);font-weight:900;font-size:11px}
.plot em{font-style:normal;font-size:22px;line-height:1.05}
.plot .pbar{width:72%;height:7px}
.plot.empty em{opacity:.5}
.plot.ready{box-shadow:0 0 0 3px var(--honey),2px 2px 0 rgba(42,26,16,.9)}
.plot.buy{background:rgba(255,255,255,.4);color:var(--text);border-style:dashed}
.plot:disabled{opacity:.55;cursor:not-allowed}
.order{border:2px solid var(--ink);border-radius:14px;background:var(--card);box-shadow:2px 3px 0 rgba(42,26,16,.9);padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.order .who{display:flex;justify-content:space-between;align-items:center;font-weight:900;font-size:13.5px}
.order .who span{font-size:12px;color:var(--forest)}
.needs{display:flex;flex-wrap:wrap;gap:5px}
.need{display:inline-flex;align-items:center;gap:2px;border:1.5px solid rgba(42,26,16,.4);border-radius:999px;padding:1px 8px 1px 4px;font-weight:900;font-size:12px;background:#e3f1d6;color:var(--forest)}
.need em{font-style:normal;font-size:15px}
.need.miss{background:#fbe0d6;color:var(--brick)}
.places{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.place{position:relative;border:2px solid var(--ink);border-radius:14px;background:var(--card);box-shadow:2px 3px 0 rgba(42,26,16,.9);padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:900;font-size:11.5px;line-height:1.15;text-align:center}
.place.locked{background:#e6d9bb;color:var(--muted)}
.place .s{position:absolute;top:-8px;right:-8px;min-width:20px;height:20px;border-radius:10px;border:2px solid var(--ink);font-style:normal;font-size:10px;display:grid;place-items:center;padding:0 3px}
.place .s.ok{background:var(--leaf);color:#fff}.place .s.new{background:var(--honey)}.place .s.idle{background:var(--card)}
.inv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
.slot{background:var(--card);border:2px solid var(--ink);border-radius:12px;padding:5px 2px;text-align:center;box-shadow:2px 2px 0 rgba(42,26,16,.9)}
.slot em{display:block;font-style:normal;font-size:22px}
.slot b{font-size:13.5px;font-variant-numeric:tabular-nums}
.note{font-size:12.5px;color:var(--muted);font-weight:700;line-height:1.45;margin:0}
.tabs{display:flex;gap:5px;background:var(--paper-2);padding:3px;border-radius:999px;border:2px solid var(--ink)}
.tabs button{flex:1;border:0;border-radius:999px;padding:5px;font-weight:900;font-size:12.5px;background:transparent}
.tabs button[aria-selected="true"]{background:var(--card);box-shadow:0 0 0 1.5px var(--ink)}
.switch{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:10px 12px;box-shadow:2px 3px 0 rgba(42,26,16,.9)}
.switch input{width:20px;height:20px;flex:none;accent-color:var(--forest);margin:2px 0 0}

.sheet.dark{background:#2b2838;color:#ece6d6}
.sheet.dark .sh-head h2{color:#f3e6c4}
.sheet.dark .note,.sheet.dark .pw small,.sheet.dark .tm{color:#b8b0c8}
.sheet.dark .job,.sheet.dark .tile{background:#3a3650;color:#ece6d6}
.sheet.dark .thumb{background:radial-gradient(circle at 50% 35%,#5c4a6e,#2a2638)}
.log{background:#1a1924;color:#ece6d6;border-radius:12px;padding:9px 11px;font-size:12.5px;line-height:1.55;max-height:150px;overflow:auto;border:2px solid var(--ink)}
.track{display:flex;flex-direction:column;gap:4px;background:linear-gradient(#4f7a35,#3f6a2a);border-radius:14px;padding:7px;border:2px solid var(--ink)}
.lane{position:relative;height:21px;border-radius:7px;background:repeating-linear-gradient(90deg,#b88a55 0 22px,#ad7f4a 22px 44px);font-size:10.5px;font-weight:900;color:#3a2410}
.lane .h{position:absolute;top:0;left:0;font-size:16px;transform:scaleX(-1)}
.lane .nm{position:absolute;right:8px;top:3px}
.lane.pick{box-shadow:0 0 0 2px var(--honey)}
.lane::after{content:"";position:absolute;right:0;top:0;bottom:0;width:4px;background:repeating-linear-gradient(#fff 0 4px,#222 4px 8px);border-radius:0 7px 7px 0}

const stat=(k,n=1)=>{S.stats[k]=(S.stats[k]||0)+n;if(S.daily)for(const t of S.daily.tasks){if(t.k===k||(t.k==='plant'&&k.startsWith('plant_')&&CROPS.some(c=>'plant_'+c.id===k)))t.p+=n}};

function scaled(r,l){const out={};for(const k in r.out)out[k]=Math.floor(r.out[k]*(1+0.5*(l-1)));return {out,t:Math.round(r.t*(1-0.15*(l-1)))}}
function canPay(r){if((r.cost||0)>S.coins)return false;for(const k in (r.in||{}))if(has(k)<r.in[k])return false;return true}
const prog=j=>Math.min(1,(now()-j.s)/(j.e-j.s));
const stageOf=j=>{const p=prog(j);return p<.34?1:p<.67?2:3};

function addXP(n){S.xp+=n;while(S.xp>=xpNeed(S.lv)){S.xp-=xpNeed(S.lv);S.lv++;levelUp()}}

function refreshMarket(force){if(!force&&now()-S.market.at<180000)return;S.market.at=now();if(!S.market.h)S.market.h={};for(const k in ITEMS){S.market.m[k]=+(0.8+Math.random()*0.45).toFixed(2);const h=S.market.h[k]||(S.market.h[k]=[]);h.push(S.market.m[k]);if(h.length>8)h.shift()}}

function sell(k,n){n=Math.min(n,has(k));if(n<=0)return;S.items[k]-=n;gain(sellPrice(k)*n,'Pazar');stat('sold',n);sfx('coin');flyCoins(Math.min(6,2+n));toast(`${n} ${ITEMS[k].n} satıldı · +₺${fmt(sellPrice(k)*n)}`);commit()}
function buyFeed(n){const c=ITEMS.yem.buy*n;if(S.coins<c)return toast('Yeterli paran yok');if(stored()+n>cap())return toast('Ambar dolu');pay(c,'Yem');S.items.yem=has('yem')+n;toast(`${n} yem alındı`);commit()}
function producible(){const set=new Set(CROPS.filter(c=>c.lvl<=S.lv).map(c=>c.id));for(const u in S.units){const d=B[u];if(d.recipes)d.recipes.filter(r=>r.lvl<=S.lv).forEach(r=>Object.keys(r.out).forEach(k=>{if(k!=='at')set.add(k)}))}return [...set]}
const NAMES=['Kasap Rıza','Fırıncı Nuri','Lokantacı Sevim','Manav Hilmi','Otelci Gülten','Kooperatif','Bakkal Ahmet','Konakçı Halit Bey','Pazarcı Zehra'];
function genOrder(){const pool=producible();
  const n=Math.min(pool.length,1+Math.floor(Math.random()*Math.min(3,1+S.lv/3)));const items={};let val=0;
  pool.sort(()=>Math.random()-.5).slice(0,n).forEach(k=>{const q=Math.max(1,Math.round((3+Math.random()*6)*(20/Math.max(ITEMS[k].p,6))**0.5));items[k]=q;val+=ITEMS[k].p*q});
  return {who:NAMES[Math.floor(Math.random()*NAMES.length)],items,base:Math.round(val*1.5),xp:Math.round(5+val/12)}}
const repMult=()=>(0.7+0.6*S.rep/100)*(has1('kangal')?1.05:1);
function ensureOrders(){while(S.orders.length<3)S.orders.push(genOrder())}
function fillOrder(i){const o=S.orders[i];for(const k in o.items)if(has(k)<o.items[k])return toast('Eksik ürün var');
  for(const k in o.items)S.items[k]-=o.items[k];const r=Math.round(o.base*repMult()*frMult(o.who));gain(r,'Sipariş');addXP(o.xp);befriend(o.who,1);S.rep=Math.min(100,S.rep+1);stat('orders');
  S.orders.splice(i,1,genOrder());sfx('coin');flyCoins(7);toast(`${o.who} memnun kaldı · +₺${fmt(r)}`);commit()}

let popLoc=null,popPlot=null;
function buildUnit(u){const d=B[u];if(S.units[u]||S.lv<d.lvl)return;if(S.coins<d.cost)return toast('Yeterli paran yok');
  pay(d.cost,'İnşaat');S.units[u]={l:1,built:now()};markRecent(locOf(u),B[u].n);sfx('build');puff(unitWorld(u,.4),14,1.3);addXP(Math.round(d.cost/50)+2);stat('built');popLoc=locOf(u);toast(`${d.n} kuruldu!`);commit()}
const upCost=u=>Math.round(B[u].cost*1.6*S.units[u].l);
function upgradeUnit(u){const s=S.units[u];if(!s||s.l>=3||s.l+1>S.house)return;const c=upCost(u);if(S.coins<c)return toast('Yeterli paran yok');
  pay(c,'İnşaat');s.l++;s.built=now();markRecent(locOf(u),B[u].n);sfx('build');if(mode!=='interior')puff(unitWorld(u,.5),12,1.2);addXP(Math.round(c/50));popLoc=locOf(u);toast(`${B[u].n} ${s.l}. seviyeye çıktı`);commit();if(interior&&interior.key===u)buildInterior(u)}
function upgradeHouse(){const h=HOUSE[S.house];if(!h||S.lv<h.lvl)return;if(S.coins<h.cost)return toast('Yeterli paran yok');pay(h.cost,'İnşaat');S.house++;markRecent('ev',HOUSE[S.house-1].n);sfx('build');addXP(Math.round(h.cost/40));popLoc='ev';toast(`${HOUSE[S.house-1].n} hazır!`);commit();if(interior&&interior.key==='kulube')buildInterior('kulube')}
function upgradeFields(){const c=FIELD_UP[S.fieldLv];if(c==null||S.fieldLv>=3||S.fieldLv+1>S.house)return;if(S.coins<c)return toast('Yeterli paran yok');pay(c,'İnşaat');S.fieldLv++;addXP(Math.round(c/50));popLoc='tarla';toast(`Tarlalar ${S.fieldLv}. seviyede`);commit()}
function startUnit(u,rid,quiet){const s=S.units[u];if(!s||s.job)return;const r=B[u].recipes.find(x=>x.id===rid);if(!r||r.lvl>S.lv||(r.col&&!has1(r.col)))return;
  if(!canPay(r)){if(!quiet)toast('Malzeme ya da para eksik');return}pay(r.cost||0,'Üretim');for(const k in (r.in||{}))S.items[k]-=r.in[k];
  const sc=scaled(r,s.l),t=sc.t*(u==='mandira'&&has1('bakir_kazan')?.9:1);s.job={r:rid,s:now(),e:now()+t*1000};s.last=rid;stat('plant_'+rid);if(!quiet){sfx('plant');commit()}}
function giveOut(out,x,y,xp,quiet){const n=Object.values(out).reduce((a,b)=>a+b,0);if(stored()+n>cap()){if(!quiet)toast('Ambar dolu! Pazarda sat ya da siloyu büyüt.');return false}
  for(const k in out)S.items[k]=has(k)+out[k];addXP(xp);if(quiet){autoGain+=n;return true}sfx('pop');if(n>=6)celebrate();if(x!=null){floatXY(x,y,Object.entries(out).map(([k,v])=>`+${v} ${ITEMS[k].e}`).join('  ')+`  +${xp} xp`);flyItems(x,y,out)}return true}
function collectUnit(u,x,y,quiet){const s=S.units[u];if(!s||!s.job||now()<s.job.e)return false;const r=unitRecipe(u),sc=scaled(r,s.l),out={...sc.out};const cb=COL_BONUS[u];if(cb&&has1(cb)){const k0=Object.keys(out)[0];out[k0]+=1}if(loveBonus(u)){const k0=Object.keys(out)[0];out[k0]+=1}
  if(!quiet&&x==null){const p=screenOfW(unitWorld(u,markH(u)));x=p.x;y=p.y}
  if(!giveOut(out,x,y,Math.ceil(r.t/12)+1,quiet))return !quiet;stat('harvest_'+u);stat('make_'+r.id);s.job=null;tryDrop(u);if(quiet)return true;
  sfx(UNIT_SFX[u]);if(mode!=='interior')puff(unitWorld(u,1),8);if(locGroups[locOf(u)])squash(locOf(u),u);commit();return true}
function plantPlot(i,rid,quiet){const f=S.fields[i];if(!f||f.job)return false;const r=cropOf(rid);if(!r||cropLocked(r))return false;if(S.coins<r.cost){if(!quiet)toast('Tohum için paran yetmiyor');return false}
  pay(r.cost,'Tohum');const sc=scaled(r,S.fieldLv);f.job={r:rid,s:now(),e:now()+sc.t*1000};S.lastCrop=rid;stat('plant_'+rid);if(!quiet)sfx('plant');return true}
function harvestPlot(i,x,y,quiet){const f=S.fields[i];if(!f||!f.job||now()<f.job.e)return false;const r=cropOf(f.job.r),sc=scaled(r,S.fieldLv);
  if(!quiet&&x==null){const p=screenOfW(plotWorld(i,1.5));x=p.x;y=p.y}
  if(!giveOut(sc.out,x,y,Math.ceil(r.t/12)+1,quiet))return false;stat('harvest_field');stat('make_'+r.id);f.job=null;tryDrop('field');if(!quiet)puff(plotWorld(i,.6),6,.8);return true}
function plotTap(i,x,y){const f=S.fields[i];if(!f)return;if(f.job&&now()>=f.job.e){harvestPlot(i,x,y);commit()}else if(!f.job){if(plantPlot(i,S.lastCrop)){floatXY(x,y,ITEMS[S.lastCrop].e+' ekildi');commit()}}else toast(`${cropOf(f.job.r).n} büyüyor · ${secs(Math.ceil((f.job.e-now())/1000))}`)}
function plantAll(){let n=0;S.fields.forEach((f,i)=>{if(!f.job&&plantPlot(i,S.lastCrop))n++});if(n)toast(`${n} parsele ${cropOf(S.lastCrop).n} ekildi`);commit()}
function harvestAll(){let n=0;S.fields.forEach((f,i)=>{if(f.job&&now()>=f.job.e&&harvestPlot(i))n++});if(n>=3)celebrate(n>=6?'Bereket yağdı!':'Bereketli!');commit()}
function buyPlot(){const n=S.fields.length;if(n>=9)return;if(S.lv<PLOT_LV[n])return toast(`Yeni parsel için seviye ${PLOT_LV[n]} gerekli`);if(S.coins<PLOT_COST[n])return toast('Yeterli paran yok');
  pay(PLOT_COST[n],'Arazi');S.fields.push({});sfx('build');puff(plotWorld(n,.4),10);popPlot=n;addXP(Math.round(PLOT_COST[n]/40));toast('Yeni tarla parseli!');commit()}
function buyRegion(r){const d=REG[r];if(owned(r)||S.lv<d.lvl)return;if(S.coins<regCost(r))return toast('Yeterli paran yok');pay(regCost(r),'Arazi');S.regions[r]=1;{const lk=Object.keys(LOC).find(k=>LOC[k].reg===r);if(lk)markRecent(lk,REG[r].n+' arazisi')}sfx('whoosh');{const [x1,z1,x2,z2]=d.rect;puff(new V3((x1+x2)/2,1,(z1+z2)/2),18,3)}addXP(Math.round(d.cost/60));toast(`${d.n} artık senin!`);view=null;renderSheet();commit()}

    const d=Math.max(sz.x,sz.y*1.2,sz.z)*2.55+1.2;c.position.set(ct.x+d*.62,ct.y+d*.5,ct.z+d*.75);c.lookAt(ct.x,ct.y*.85,ct.z);tr.render(sc,c);THUMB[key]=tr.domElement.toDataURL('image/png');sc.remove(g)};
  for(const k in MODELS)doOne(k,g=>MODELS[k](g,{b:k,l:1,job:k==='sera'?{r:'domates',s:0,e:1}:k==='bahce'?{r:'elma',s:0,e:1}:null}));
  for(let l=1;l<=4;l++)doOne('kulube'+l,g=>g.add(house(l)));
  doOne('tarla',g=>fieldBed(g,{job:{r:'bugday',s:0,e:1}}));doOne('pazar',g=>marketModel(g),5);doOne('han',g=>hanModel(g),4);
  doOne('panayir',g=>fairModel(g),5);
  doOne('hipo',g=>{const h=horse(0x8a5530,0x2e1d12,0xc4492e);g.add(h)},1.6);
  tr.dispose();if(tr.forceContextLoss)tr.forceContextLoss();OUT.uniforms.thick.value=.0024}

// ================= DÖNGÜ =================
const clock=new THREE.Clock();
const vo={x:0,y:0};
function viewOffset(c){const W=innerWidth,H=innerHeight;let tx=0,ty=0;if(!sheet.hidden&&mode!=='hub'||(!sheet.hidden&&view&&view.k==='region')){const r=sheet.getBoundingClientRect();if(W>700)tx=Math.max(0,(W-r.left))/2;else ty=Math.max(0,(H-r.top))/2}
  vo.x+=(tx-vo.x)*.12;vo.y+=(ty-vo.y)*.12;if(!tx&&!ty&&Math.abs(vo.x)<.5&&Math.abs(vo.y)<.5){vo.x=vo.y=0;if(c.view&&c.view.enabled)c.clearViewOffset();return}c.setViewOffset(W,H,vo.x,vo.y,W,H)}
function resize(){const w=innerWidth,h=innerHeight;R.setSize(w,h,false);dcam.aspect=w/h;dcam.fov=w<700?50:42;dcam.updateProjectionMatrix();if(typeof S!=='undefined'&&S&&(dcam.aspect<.85)!==deskPortrait&&DESKP.length)buildDesk();cam.aspect=w/h;cam.fov=w<700?50:36;cam.updateProjectionMatrix();icam.aspect=w/h;icam.fov=w<700?60:42;icam.updateProjectionMatrix()}
addEventListener('resize',resize);
function frame(){requestAnimationFrame(frame);const dt=Math.min(.05,clock.getDelta()),t=clock.elapsedTime;OUT.uniforms.jit.value=mode==='desk'?0:Math.floor(t*8)*1.37;
  if(mode==='desk'){worldTick(dt,t);renderWindow(dt);viewOffset(dcam);deskFrame(dt,t);placeMarks();R.render(deskScene,dcam)}
  else if(mode!=='interior'){viewOffset(cam);stepFly();ctl.update();worldTick(dt,t);placeMarks();R.render(world,cam)}
  if(!sayB.hidden)placeBubble();
  else if(interior){viewOffset(icam);ictl.update();interior.fx.forEach(f=>f(dt,t));for(const o of interior.scene.children){const u=o.userData;if(u.hop){u.hop=Math.max(0,u.hop-dt*2.5);o.position.y=Math.sin((1-u.hop)*Math.PI)*.5}}R.render(interior.scene,icam)}}
function tick(){
  document.querySelectorAll('[data-e]').forEach(el=>{el.style.width=Math.min(100,(now()-el.dataset.s)/(el.dataset.e-el.dataset.s)*100)+'%'});
  document.querySelectorAll('[data-left]').forEach(el=>{el.textContent=el.dataset.pre+' '+secs(Math.max(0,Math.ceil((+el.dataset.left-now())/1000)))});
  updateWeather();applySeason();if(checkDaily())showLogin();ensureContests();if(ensureContracts()&&view&&view.loc==='han')renderSheet();
  if(S.weather.k==='rain'||S.weather.k==='storm'){for(const f of S.fields)if(f.job&&now()<f.job.e)f.job.e-=150;const se=S.units.sera;if(se&&se.job&&now()<se.job.e)se.job.e-=150}
  if(++autoTick%4===0&&automate()){save();if(view)view.sig='';}
  notifyReady();if(deskSigNow()!==deskSig)buildDesk();if(!document.body.classList.contains('photo'))farmerSay();else sayB.hidden=true;
  syncWorld();
  if(view&&sheetSig()!==view.sig&&!(race&&race.running))renderSheet();
  if(view&&view.k==='loc'&&view.loc==='pazar'&&now()-S.market.at>=180000){refreshMarket();renderSheet()}
  if(interior&&intSig(interior.key)!==interior.sig)interior.refresh();
  renderHUD()}
function boot(data){
  S=migrate((data&&data.house!=null)?data:(load()||fresh()));const away=S.lastSeen?Date.now()-S.lastSeen:0;refreshMarket();ensureOrders();updateWeather();applySeason();checkDaily();ensureContests();ensureContracts();automate();
  try{makeThumbs()}catch(e){console.warn(e)}
  ctl.enabled=false;buildDesk();resize();syncWorld(true);renderHUD();setModeUI();frame();setInterval(tick,500);setInterval(save,5000);
  const bt=$('#boot');bt.style.transition='opacity .5s';bt.style.opacity='0';setTimeout(()=>bt.remove(),550);
  booted=true;awaySummary(away);showLogin();setTimeout(friendGifts,1500);
  if(!S.stats.welcomed){S.stats.welcomed=1;setTimeout(()=>toast('Masadaki haritaya dokun, çiftliğe çık!'),900)}save()
}
const startGame=data=>Promise.race([document.fonts?Promise.all([document.fonts.load('20px "Alfa Slab One"'),document.fonts.load('800 14px Nunito')]).then(()=>document.fonts.ready):Promise.resolve(),new Promise(r=>setTimeout(r,2500))]).then(()=>boot(data));
window.claude?.hot?.snapshot?.(()=>S);
window.claude?.hot?.ready?window.claude.hot.ready(startGame):startGame(window.claude?.hot?.data??null);
</script>
